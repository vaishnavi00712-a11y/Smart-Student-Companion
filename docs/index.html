<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Student Companion - Academic Backend</title>
    <meta name="description" content="Python FastAPI backend and interactive API companion for Assignment, Attendance, and Marks management." />
    <meta property="og:title" content="Smart Student Companion - Academic Backend" />
    <meta property="og:description" content="Python FastAPI backend and interactive API companion for Assignment, Attendance, and Marks management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body style="margin: 0; background-color: #0F1115;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0F1115; color: #D1D5DB; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; gap: 16px;">
        <div style="width: 32px; height: 32px; border: 3px solid #2D3139; border-top-color: #6366F1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="font-size: 14px; font-weight: 500; color: #9CA3AF; letter-spacing: 0.02em;">Loading Smart Student Companion...</div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>

    <!-- 1. Vite Development Server (AI Studio / localhost) -->

    <!-- 2. Static Production Fallback (Automatic for GitHub Pages root deployment) -->
    <script>
      (function() {
        setTimeout(function() {
          if (!window.__APP_MOUNTED__) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = './assets/index.css';
            document.head.appendChild(link);

            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/index.js';
            document.body.appendChild(script);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
